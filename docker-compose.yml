services:
  bbasm:
    build: .
    init: true
    ports:
      - "127.0.0.1:${BBASM_PORT:-8000}:${BBASM_PORT:-8000}"
    env_file: .env
    environment:
      BBASM_BIND: 0.0.0.0
      BBASM_BBROOT: /opt/claude-bug-bounty
      BBASM_DATA: /app/data
      BBASM_TARGETS: /app/targets
      BBASM_STATIC: /app/backend/static
    volumes:
      - ./data:/app/data
      - ./targets:/app/targets
    restart: unless-stopped
