services:
  bbasm:
    build: .
    init: true
    ports:
      - "127.0.0.1:${BBASM_PORT:-8000}:${BBASM_PORT:-8000}"
    env_file: .env
    environment:
      BBASM_BIND: 0.0.0.0
      BBASM_BBROOT: /opt/claude-bug-bounty
      BBASM_DATA: /app/data
      BBASM_TARGETS: /app/targets
      BBASM_STATIC: /app/backend/static
      BBASM_NUCLEI_TEMPLATES: /app/templates
    volumes:
      - ./data:/app/data
      - ./targets:/app/targets
      # Nuclei templates live on a named volume: fast on Windows/macOS (no bind mount of ~14,000 small files) and kept by
      # `docker compose up --force-recreate`. `docker compose down -v` deletes them; reinstall from the Tools page.
      - bbasm-templates:/app/templates
    restart: unless-stopped

volumes:
  bbasm-templates:
